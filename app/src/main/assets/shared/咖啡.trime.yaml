  Shift_back_color: off_key_back_color
  hilited_Shift_back_color: hilited_off_key_back_color
  Shift_text_color: off_key_text_color
  hilited_Shift_text_color: hilited_off_key_text_color
  Back_back_color: off_key_back_color #退格=功能键
