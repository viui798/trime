# Trime default style settings
# encoding: utf-8

#咖啡·主题 中文无障碍版
#●自用，不分享不传播●
#二改请注明

#增高主题、机械键盘主题、机械键盘•增高主题均依赖此主题

#参考同文Trime主题
#部分皮肤移植自搜狗、百度
#为了显示最佳效果，请上滑删除键，切换至简洁模式。
#测试手机分辨率1080*2400
#横屏未适配
#皮肤基础功能介绍：

#WERTYUIO长按、上滑、下滑——数字
#QP长按、上滑——1、0，下滑——上下翻页
#A-L上滑、下滑——直接输出符号
#A-L长按——输出方案定义的符号
#Z-M长按、上滑——符号
#Z-M下滑——全选、复制、粘贴、剪切、编辑键盘
#DF下滑——日期、时间

#锁定键上滑——剪贴板
#锁定键下滑——简洁键盘
#删除键上滑——清空
#删除键左滑——清行
#删除键下滑——无刻键盘

#有输入时，123键、❖键——2、3选重，不提示2、3选重的标识
#有输入时，锁定键——清码
#有输入时，回车键——上屏编码

#左下1键长按——菜单键盘
#左下1键上滑——方案菜单
#左下2键长按——编辑键盘
#左下2键上下滑——助记键盘（请自行替换zhuji目录的a.png—z.png图片）
#回车键长按——主题
#回车键上滑——配色
#空格键长按——切换中英
#空格上下左右——光标上下左右移动

#底栏显示不准确的，请微调 &回车宽度 的值。中文无障碍的bug。
#竖屏模式下，屏幕左右两侧与键盘的距离不一致的，请调整&曲面屏左、&曲面屏右的值为1

config_version: "3.0"
name: 咖啡 #主题名称
author: 咖啡 #作者资讯

Custom: #以下参数自行调整，测试手机分辨率1080*2400。
  #候选栏及编码区
  A: &提示区高 16 #comment_height
  B: &候选区高度 18 #candidate_view_height
  C: &候选字间距 8 #candidate_padding
  #主键盘
  ①: &主键高 71 #key_height
  ②: &底部增高 4
  ③: &曲面屏左 1 #左右留空位置不一致，请调整为1
  ④: &曲面屏右 1 #左右留空位置不一致，请调整为1
  ⑤: &空白行 4 #候选与按键间隔空白行
  ⑥: &key_border 1 #按键边框
  ⑦: &回车宽度 19.6 #底栏显示不准确的，请微调此行中的值。
  #字符键盘
  ❶: &常用字符键盘列表行高 57 #=主键高-6
  #字体
  ㊀: &编码区字号 16 #text_size
  ㊁: &悬浮窗候选项序号大小 16 #label_text_size
  ㊂: &候选字号 20 #candidate_text_size
  ㊃: &候选注释字号 13 #候选注释字体大小
  ㊄: &键字号 16 #key_text_size
  ㊅: &符号字号 8 #symbol_text_size
  ㊆: &长标签字号 16 #key_long_text_size
  ㊇: &选单图形字号 16
  ㊈: &选单文字字号 10
  ㊉: &键盘字体 kafei.ttf
  ㊉㊀: &候选注释字体 LXGWWenKaiGBScreenR.ttf #拆分字体
  #字符偏移
  ⅰ: &按键x偏移 0 #key_text_offset_x
  ⅱ: &按键y偏移 -0.5 #key_text_offset_y
  ⅲ: &符号X偏移 2.5 #key_symbol_offset_x
  ⅳ: &符号Y偏移 10 #key_symbol_offset_y
  ⅴ: &助记符号x偏移 0 #key_hint_offset_x
  ⅵ: &助记符号y偏移 -10 #key_hint_offset_y
  Ⅶ: &选单图形y偏移 -2
  Ⅷ: &选单文字y偏移 -3
  Ⅸ: &选单返回y偏移 0
  Ⅹ: &空格文字y偏移 5
  Ⅺ: &空格符号y偏移 12

style:
  auto_caps: false #自动句首大写:true|false|ascii
  keyboard_height: 273
  keyboard_height_land: 223 #3.2.6锁定横屏下键盘高度，避免切换时键盘高度变化而造成闪烁
  horizontal_gap: 0 #按键左右间距
  vertical_gap: 0 #按键上下间距
  candidate_font: [CangErMingHeiTi.ttf] #候选栏字体
  candidate_padding: *候选字间距 #候选字间距
  candidate_spacing: 0 #候选分隔宽度
  candidate_text_size: *候选字号 #候选字号
  candidate_view_height: 24 #候选区高度（略大于候选字号，避免多字候选被缩小）
  comment_font: [CangErMingHeiTi.ttf] #候选注释字体
  comment_height: *提示区高 #候选注释区高度
  comment_text_size: *候选注释字号 #候选注释大小
  comment_position: right #候选注释在右侧
  hanb_font: [98WB-U.otf] #候选䃼充字体（生僻字

  key_font: [kafei.ttf] #键盘主字体
  key_height: *主键高 #键高
  key_long_text_size: *长标签字号 #长标签字号
  key_text_size: *键字号 #键字号
  key_width: 10.0 #键宽，占屏幕宽的百分比
  label_text_size: *悬浮窗候选项序号大小 #悬浮窗候选项序号大小，标签字号
  label_font: [CangErMingHeiTi.ttf] #候选栏序号字体
  latin_font: [] #留空，避免抢主字体/候选字体的回退优先级
  popup_font: [ZiGaiZiYong.otf] #按键气泡字体
  popup_height: 10 #按键气泡高度
  popup_bottom_margin: 10 #按键气泡纵向偏移
  popup_text_size: 30 #按键气泡字号
  reset_ascii_mode_on_focus_change: false #焦点变更时重置中英状态
  round_corner: 0 #按键圆角半径
  shadow_radius: 0.0 #按键字母阴影
  key_border: *key_border ##同文晢无作用，无障碍用#按键边缘阴影
  symbol_font: [ZiGaiZiYong.otf] #符号字体
  symbol_text_size: *符号字号 #符号字号
  text_font: [ziti.ttf] #编码字体

preedit:
  horizontal_padding: 6 #编码区内边距
  foreground:
    font_size: *编码区字号 #编码区字号

window: #悬浮候选窗口参数
  insets:
    vertical: 4 #纵向内边距
    horizontal: 6 #水平内边距
  item_padding:
    vertical: 0
    horizontal: 4
  min_width: 0
  corner_radius: 10 #候选窗口圆角
  border: 1 #候选窗口边框宽度
  shadow: 1.0 #阴影
  alpha: 0.8 #透明度（0-1）
  foreground:
    label_font_size: *悬浮窗候选项序号大小 #悬浮窗候选项序号大小
    text_font_size: *候选字号 #候选字号
    comment_font_size: *候选注释字号 #候选注释字号

fallback_colors:
  ##border_color back_color 必须指定其中一项
  candidate_background: candidate_back_color
  candidate_back_color: back_color
  keyboard_back_color: back_color #键盘背景图/色=悬浮窗边框
##悬浮窗
  #text_color编码色
  border_color: back_color #悬浮窗边框=状态栏背景
  label_color: candidate_text_color #悬浮窗候选序号=候选文字
  hilited_text_color: text_color #高亮编码=编码
  hilited_back_color: back_color #高亮编码背景=状态栏背景
  text_back_color:  #编码区背景图/色，即悬浮窗背景=状态栏背景##（3.2.3后续版本支持背景图）仅当style/layout/background设置失效时才会起作用（当background生效时，text_back_color就会失效）
#候选栏
  back_color: border_color #状态栏背景=悬浮窗边框
  hilited_candidate_back_color: hilited_back_color #高亮候选背景=高亮编码背景
  candidate_separator_color: border_color #候选分隔=悬浮窗边框
  candidate_text_color: text_color #候选文字（包括悬浮窗候选）=编码
  hilited_candidate_text_color: hilited_text_color #高亮候选文字（包括悬浮窗候选）=高亮编码
  comment_text_color: candidate_text_color #候选项注释=候选文字
  hilited_comment_text_color: comment_text_color #高亮候选项注释=候选项注释
  hilited_label_color: hilited_candidate_text_color # 高亮候选序号=高亮候选文字
#键盘
  key_back_color: back_color #按键背景图/色=状态栏背景
  hilited_key_back_color: hilited_candidate_back_color #高亮按键背景图/色=高亮候选文字背景
  key_text_color: candidate_text_color #按键文字=候选文字
  hilited_key_text_color: hilited_candidate_text_color #高亮按键文字=高亮候选文字
  key_symbol_color: comment_text_color #按键符号=候选项注释
  hilited_key_symbol_color: hilited_comment_text_color #高亮按键符号=高亮提示
  shadow_color: border_color #按键文字阴影=悬浮窗边框（阴影半径在shadow_radius中设定）
  key_border_color: border_color #按键边框*(暂无)=键盘背景##同文晢无作用
#功能键（functional: true）
#在没有特别指定的时候，功能键的long_click和hint颜色与普通按键一样
#shift键锁定时的这四种颜色不会因为functional: false而失效
  off_key_back_color: key_back_color #功能键背景图/色=按键背景
  hilited_off_key_back_color: hilited_key_back_color #功能键高亮背景图/色（按下时）=高亮按键背景
  off_key_text_color: key_text_color #功能键文字=按键文字
  hilited_off_key_text_color: hilited_key_text_color #功能键高亮文字（按下时）=高亮按键文字
  on_key_back_color: hilited_key_back_color #shift键锁定时背景图/色=高亮按键背景
  hilited_on_key_back_color: hilited_key_back_color #shift键锁定时的高亮背景图/色（按下时）=高亮按键背景
  on_key_text_color: hilited_key_text_color #shift键锁定时文字=高亮按键文字
  hilited_on_key_text_color: hilited_key_text_color #shift键锁定时的高亮文字（按下时）=高亮按键文字
#按键气泡
  popup_back_color: key_back_color #气泡背景=按键背景
  popup_text_color: key_text_color #气泡文字=按键文字
##以下为自定义参数
#符号1（左1键）
  Symbol_back_color: off_key_back_color #符号1=功能键
  Symbol_text_color: off_key_text_color
  Symbol_symbol_color: key_symbol_color
  hilited_Symbol_back_color: hilited_off_key_back_color
  hilited_Symbol_text_color: hilited_off_key_text_color
  hilited_Symbol_Symbol_color: hilited_Symbol_text_color
  Symbol_key_border_color: key_border_color
#符号2（左2键）
  Symbol2_back_color: off_key_back_color #左2键=符号1
  Symbol2_text_color: off_key_text_color
  Symbol2_symbol_color: key_symbol_color
  hilited_Symbol2_back_color: hilited_off_key_back_color
  hilited_Symbol2_text_color: hilited_off_key_text_color
  hilited_Symbol2_Symbol_color: hilited_Symbol_text_color
  Symbol2_key_border_color: key_border_color
#空格左（逗号）
  Comma_back_color: Symbol2_back_color #空格左=符号2
  Comma_text_color: Symbol2_text_color
  Comma_symbol_color: Comma_text_color
  hilited_Comma_back_color: hilited_Symbol2_back_color
  hilited_Comma_text_color: hilited_Symbol2_text_color
  hilited_Comma_Symbol_color: hilited_Comma_text_color
  Comma_key_border_color: key_border_color
#空格
  Space_back_color: key_back_color #空格=按键
  Space_text_color: key_text_color
  Space_symbol_color: Space_text_color
  hilited_Space_back_color: hilited_key_back_color
  hilited_Space_text_color: hilited_key_text_color
  hilited_Space_Symbol_color: hilited_Space_text_color
  Space_key_border_color: key_border_color
#空格右（句号）
  Period_back_color: Comma_back_color #空格右=空格左
  Period_text_color: Comma_text_color
  Period_symbol_color: Period_text_color
  hilited_Period_back_color: hilited_Comma_back_color
  hilited_Period_text_color: hilited_Comma_text_color
  hilited_Period_Symbol_color: hilited_Period_text_color
  Period_key_border_color: key_border_color
#删除
