preset_keys:
  # 安卓
  BRIGHTNESS_DOWN: {label: 亮度-, send: BRIGHTNESS_DOWN}
  BRIGHTNESS_UP: {label: 亮度+, send: BRIGHTNESS_UP}
  CALCULATOR: {label: 计算机, send: CALCULATOR}
  CALENDAR: {label: 日历, send: CALENDAR}
  CONTACTS: {label: 联系人, send: CONTACTS}
  ENVELOPE: {label: 邮箱, send: ENVELOPE}
  EXPLORER: {label: 浏览器, send: EXPLORER}
  MUSIC: {label: 音乐, send: MUSIC}
  POWER: {label: 电源, send: POWER}
  SEARCH: {label: 查找, send: Find}
  SLEEP: {label: 休眠, send: SLEEP}
  VOICE_ASSIST: {label: 语音, send: VOICE_ASSIST}
  VOLUME_DOWN: {label: 音量-, send: VOLUME_DOWN}
  VOLUME_UP: {label: 音量+, send: VOLUME_UP}
  VOLUME_MUTE: {label: 静音, send: VOLUME_MUTE}
  # 编辑
  Shift1: {label: ☩, send: Shift_L, shift_lock: click} #英文状态一次锁定
  Shift2: {label: ☩, send: Shift_L, shift_lock: click, functional: false} #英文状态一次锁定
  Shift_L: {label: Shift, send: Shift_L, shift_lock: ascii_long} #中文状态一次锁定，英文状态长按锁定
  Shift_L1: {label: ▲, send: Shift_L, shift_lock: ascii_long} #中文状态一次锁定，英文状态长按锁定
  Return: {label: Enter, send: Return}
  Return1: {label: 回车, send: Return}
  Hide: {label: 隐藏, send: BACK}
  BackSpace: {label: 删除, functional: false, repeatable: true, send: BackSpace}
  BackSpace1: {label: ⌫, repeatable: true, send: BackSpace}
  Space: {repeatable: false, functional: false, send: space}
  space1: {repeatable: true, preview: '␣', label: " ", functional: true, send: space}
  space2: {label: 空格, repeatable: true, send: space}
  Escape: {label: Esc, send: Escape}
  Tab: {label: Tab, send: Tab}
  Home: {label: ⇤, send: Home, functional: false}
  Insert: {label: 插入, send: Insert}
  Delete: {label: 刪除, send: Delete}
  End: {label: ⇥, send: End, functional: false}
  Page_Up: {label: △, functional: false, send: Page_Up}
  Page_Down: {label: ▽, functional: false, send: Page_Down}
  Left: {label: '←', send: Left, functional: false}
  Down: {label: '↓', send: Down, functional: false}
  Up: {label: '↑', send: Up, functional: false}
  Right: {label: '→', send: Right, functional: false}
  select_all: {label: ☑, send: Control+a, functional: false}
  Clear: {label: 全清, text: "{Control+a}{BackSpace}"} #全選並刪除
  cut: {label: ✁, send: Control+x, functional: false}
  cut_all: {label: 全剪, text: "{Control+a}{Control+x}"} #全選並剪切
  copy: {label: ❐, send: Control+c, functional: false}
  copy_all: {label: 全复, text: "{Control+a}{Control+c}"} #全選並複製
  paste: {label: ▣, send: Control+v, functional: false}
  paste_text: {label: 貼上文本, send: Control+Shift+Alt+v} #>=Android 6.0
  share_text: {label: 分享文本, send: Control+Alt+s} #>=Android 6.0
  redo: {label: ↶, send: Control+Shift+z, functional: false} #>=Android 6.0
  undo: {label: ↷, send: Control+z, functional: false} #>=Android 6.0
  ClearH: {label: '☒', text: "{End}{Shift+Home}{Delete}", functional: false}
  K_back: {label: 返回, functional: false, send: Eisu_toggle, select: .last_lock}

  #选重
  Second: {label: '123', functional: false, send: Control+2}
  Third3: {label: '3', functional: false, send: Control+3}
  #Second: {label: '②', functional: false, send: Control+2}
  Third: {label: '❖', functional: false, send: Control+3}
  #Third: {label: '③', functional: false, send: Control+3}
  Fourth: {label: '⎇4', functional: false, send: Control+4}
  # rime组合键
  F4: {label: 方案选单, send: F4}
  BackToPreviousSyllable: {label: 删音节, send: Control+BackSpace}
  CommitRawInput: {label: 编码, send: Control+Return}
  CommitScriptText: {label: 编码, send: Shift+Return}
  CommitComment: {label: 编码, send: Control+Shift+Return}
  DeleteCandidate: {label: 删词, send: Control+Delete}
  # rime状态
  Mode_switch: {toggle: ascii_mode, send: SWITCH_CHARSET, states: [ 中文, 英文 ]}
  Zenkaku_Hankaku: {toggle: full_shape, send: SWITCH_CHARSET, states: [ 半角, 全角 ]}
  Henkan: {toggle: simplification, send: SWITCH_CHARSET, states: [ 繁体, 简体 ]}
  Charset_switch: {toggle: extended_charset, send: SWITCH_CHARSET, states: [ 常用, 扩充 ]}
  Punct_switch: {toggle: ascii_punct, send: SWITCH_CHARSET, states: [ 。，, ．， ]}
  #切换键盘
  Keyboard_edit: {label: '编辑', functional: true, send: Eisu_toggle, select: _edit_board}
  Keyboard_symbols: {label: '❖', send: Eisu_toggle, select: symbols}
  Keyboard_symbols_cy: {label: '常用', send: Eisu_toggle, select: symbols_cy}
  Keyboard_symbols_en: {label: '英文', send: Eisu_toggle, select: symbols_en}
  Keyboard_symbols_cn: {label: '中文', send: Eisu_toggle, select: symbols_cn}
  Keyboard_symbols_pair: {label: '成对', send: Eisu_toggle, select: symbols_pair}
  Keyboard_symbols_math: {label: '数学', send: Eisu_toggle, select: symbols_math}
  Keyboard_symbols_shu: {label: '竖标', send: Eisu_toggle, select: symbols_shu}
  Keyboard_symbols_special: {label: '特Ⅰ', send: Eisu_toggle, select: symbols_special}
  Keyboard_symbols_special2: {label: '特Ⅱ', send: Eisu_toggle, select: symbols_special2}
  Keyboard_symbols_sequence: {label: '序Ⅰ', send: Eisu_toggle, select: symbols_sequence}
  Keyboard_symbols_sequence2: {label: '序Ⅱ', send: Eisu_toggle, select: symbols_sequence2}
  Keyboard_number: {label: '123', send: Eisu_toggle, select: number}
  #Keyboard_number: {label: 'ϟ12', send: Eisu_toggle, select: number}
  Keyboard_default: {label: '返回', functional: false, send: Eisu_toggle, select: .default} #候选翻页返回用的此项
  Keyboard_default1: {label: '返回', send: Eisu_toggle, select: .default} #候选翻页返回用的此项
  K_default: {label: '返回', send: Eisu_toggle, select: .default}
  Keyboard_last: {label: '返回', send: Eisu_toggle, select: .last_lock}
  Keyboard_defaultmd: {label: '无刻', send: Eisu_toggle, select: defaultmd}
  Keyboard_defaultzj: {label: '助记', send: Eisu_toggle, select: defaultzj}
  Keyboard_defaultjj: {label: '简洁', send: Eisu_toggle, select: defaultjj}
  Keyboard_letter: {label: 英文, send: Eisu_toggle, select: default}
  Keyboard_switch: {label: 键盘, send: Eisu_toggle, select: .next}
  Keyboard_menu: {label: ☼, preview: ' ', functional: false, send: Eisu_toggle, select: menu}
  # trime设定
  IME_switch: { label: 🌐, send: LANGUAGE_SWITCH } #弹出对话框选择方案
  IME_last: { label: 上一输入法, send: LANGUAGE_SWITCH, select: .last } #直接切换到上一输入法
  IME_next: { label: 下一输入法, send: LANGUAGE_SWITCH, select: .next } #直接切换到下一输入法
  Schema_switch: {label: 下一方案, send: Control+Shift+1}
  Color_switch: {label: 配色, send: PROG_RED}
  Help: {label: 帮助, send: Help}
  Info: {label: 关于, send: INFO}
  Menu: {label: 选单, send: MENU}
  Settings: {label: 设置, send: SETTINGS}
  Color_settings: {label: 配色, send: SETTINGS, option: "color"}
  Theme_settings: {label: 主题, send: SETTINGS, option: "theme"}
  Schema_settings: {label: Schema, send: SETTINGS, option: "schema"}
  Candidate_switch: {toggle: _hide_candidate, send: SWITCH_CHARSET, states: [ 有候选, 无候选]}
  Comment_switch: {toggle: _hide_comment, send: SWITCH_CHARSET, states: [ 有注释, 无注释]}
  Hint_switch: {toggle: _hide_key_hint, send: SWITCH_CHARSET, states: [ 有助记, 无助记]}

  # trime命令
  Date: {label: 日期, command: date, option: "yyyy年MM月dd日"}
  ChineseDate: {label: 农历, command: date, option: "zh_CN@calendar=chinese"} #农历等日期(>=Android 7.0)：date 语言@calendar=历法 格式。具体参考https://developer.android.com/reference/android/icu/util/Calendar.html
  Time: {label: 时间, command: date, option: "HH:mm:ss"} #时间： date 格式
