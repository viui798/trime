  default:
    name: '26键盘'
    author: '咖啡'
    width: 9.8
    lock: true #切換程序時記憶鍵盤
    ascii_mode: 0
    height: *主键高 #同文已经不需要了
    key_symbol_offset_x: *符号X偏移 #长按符号x方向偏移量
    key_symbol_offset_y: *符号Y偏移 #长按符号y方向偏移量
    key_text_offset_x: *按键x偏移 #按键文本x方向偏移量
    key_text_offset_y: *按键y偏移 #按键文本y方向偏移量
    key_hint_offset_x: *助记符号x偏移 #助记符号x方向偏移量（向右为正）
    key_hint_offset_y: *助记符号y偏移 #助记符号y方向偏移量（向下为正）
    key_press_offset_x: 0 #按键按下时所有文本x方向偏移量
    key_press_offset_y: 0 #按键按下时所有文本y方向偏移量
