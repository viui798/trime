preset_color_schemes:
  kfa03:
    name: 咖啡·简•◎
    author: 咖啡·资源来自森林集
    #悬浮窗
    text_color: 0xff191919 #编码色
    hilited_back_color: 0x00 #高亮编码背景
    #候选栏
    back_color: 0xffE9EAEE #候选栏背景#底色色值，下巴色可设置此值
    hilited_candidate_text_color: 0xff1A73E9 #高亮候选文字（包括悬浮窗候选）
    comment_text_color: 0xff5A5E5F #候选项注释=候选文字
    #键盘
    hilited_key_text_color: 0xff191919 #高亮按键文字
    key_back_color: kafei/wx1.9.png #按键背景
    hilited_key_back_color: kafei/wx2.9.png #高亮按键背景
    key_symbol_color: 0xff5A5E5F #按键符号
    hilited_key_symbol_color: 0x00 #高亮按键符号
    #功能键
    off_key_back_color: kafei/wx3.9.png #功能键背景图/色
    hilited_off_key_back_color: kafei/wx4.9.png #功能键高亮背景图
    on_key_back_color: kafei/wx5.9.png #shift键锁定时背景图/色=高亮按键背景
    hilited_on_key_back_color: kafei/wx4.9.png #shift键锁定时的高亮背景图/色
    on_key_text_color: 0xFFFFFFFF #shift键锁定时文字=高亮按键文字
    #回车键
    Return_back_color: kafei/wx5.9.png
    hilited_Return_back_color: kafei/wx6.9.png
    Return_text_color: 0xFFFFFFFF
    hilited_Return_text_color: 0xFFFFFFFF
    Return_symbol_color: 0xFFFFFFFF
    hilited_Return_Symbol_color: 0xFFFFFFFF
    hilited_back_color: 0x00
    hilited_key_symbol_color: 0x00
    Symbol_symbol_color: 0x00
    hilited_Symbol_Symbol_color: 0x00
    Symbol2_symbol_color: 0x00
    hilited_Symbol2_Symbol_color: 0x00
    Return_symbol_color: 0x00
    hilited_Return_Symbol_color: 0x00
    m_kf: 0xffcccccc
    m_kfa: 0xffcccccc

